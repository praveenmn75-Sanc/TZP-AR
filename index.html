<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TZP Wildlife AR Zone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- Production A-Frame, AR.js, and Animation Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Touch & Gesture Handlers -->
  <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector-component@v1.0.1/gesture-detector.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector-component@v1.0.1/gesture-handler.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }

    /* Landing Screen Overlay */
    #landing-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #121212;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #00ff88;
      letter-spacing: 1px;
    }

    .select-label {
      font-size: 14px;
      margin-bottom: 10px;
      color: #ccc;
    }

    select.btn-select {
      width: 80%;
      max-width: 300px;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #00ff88;
      background: #1e1e1e;
      color: #fff;
      outline: none;
      margin-bottom: 25px;
    }

    .btn-launch {
      background: #00ff88;
      color: #05200a;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
    }

    /* Watermark */
    #watermark {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9998;
      color: #00ff88;
      font-weight: bold;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      pointer-events: none;
    }

    /* AR UI Controls */
    #ar-ui {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 400px;
    }

    .control-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .ar-btn {
      background: rgba(30, 30, 30, 0.85);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .btn-action {
      background: #00ff88;
      color: #05200a;
      border: none;
    }

    .btn-home {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Landing Screen -->
  <div id="landing-screen">
    <div class="title">TZP WILDLIFE AR ZONE</div>
    <div class="select-label">Select an Animal Experience:</div>
    <select id="animal-select" class="btn-select">
      <option value="tiger_anim">Bengal Tiger (Walking 🐾)</option>
      <option value="elephant_anim">Asian Elephant (Walking 🐘)</option>
      <option value="tiger">Bengal Tiger (Static 🐅)</option>
      <option value="elephant">Asian Elephant (Static 🐘)</option>
    </select>
    <button class="btn-launch" id="launch-btn">Launch AR Camera</button>
  </div>

  <div id="watermark">TZP WILDLIFE AR</div>

  <div id="ar-ui">
    <div class="control-row">
      <button class="ar-btn btn-home" onclick="goHome()">Home 🏠</button>
      <button class="ar-btn" onclick="toggleCamera()">Flip Cam 🔄</button>
      <button class="ar-btn" onclick="playSound()">Roar 🔊</button>
    </div>
    <div class="control-row">
      <button class="ar-btn btn-action" onclick="takeSnapshot()">Take Photo 📸</button>
      <button class="ar-btn btn-action" id="rec-btn" onclick="toggleVideoRecord()">Record Video 🎥</button>
    </div>
  </div>

  <!-- Gesture-Enabled WebAR Scene -->
  <a-scene 
    embedded 
    gesture-detector
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false">
    
    <a-light type="ambient" intensity="2.5"></a-light>
    <a-light type="directional" position="1 4 2" intensity="2.0"></a-light>

    <a-entity camera look-controls></a-entity>
    
    <!-- Gesture Interactive Model Anchor -->
    <a-entity 
      id="active-animal"
      class="cantap"
      gesture-handler="minScale: 0.1; maxScale: 3.0;">
    </a-entity>
  </a-scene>

  <script>
    // Audio Resources
    const SOUNDS = {
      tiger: new Audio('https://cdn.freesound.org/previews/512/512132_10825368-lq.mp3'),
      elephant: new Audio('https://cdn.freesound.org/previews/464/464871_9511679-lq.mp3')
    };

    function playSound() {
      const selected = document.getElementById('animal-select').value;
      const key = selected.includes('elephant') ? 'elephant' : 'tiger';
      
      if (SOUNDS[key]) {
        SOUNDS[key].currentTime = 0;
        SOUNDS[key].play().catch(e => console.log('Audio permission required:', e));
      }
    }

    document.getElementById('launch-btn').addEventListener('click', function() {
      const selected = document.getElementById('animal-select').value;
      const entity = document.getElementById('active-animal');

      if (entity) {
        entity.removeAttribute('gltf-model');
        entity.removeAttribute('animation-mixer');

        if (selected === 'tiger_anim') {
          entity.setAttribute('gltf-model', 'assets/tiger_anim.glb');
          entity.setAttribute('scale', '0.4 0.4 0.4');
          entity.setAttribute('rotation', '0 0 0');
          entity.setAttribute('position', '0 -1.2 -2.0');
          entity.setAttribute('animation-mixer', 'clip: *; loop: repeat;');
        } 
        else if (selected === 'elephant_anim') {
          entity.setAttribute('gltf-model', 'assets/elephant_anim.glb');
          entity.setAttribute('scale', '0.4 0.4 0.4');
          entity.setAttribute('rotation', '0 0 0');
          entity.setAttribute('position', '0 -1.2 -2.5');
          entity.setAttribute('animation-mixer', 'clip: *; loop: repeat;');
        } 
        else if (selected === 'tiger') {
          entity.setAttribute('gltf-model', 'assets/tiger.glb');
          entity.setAttribute('scale', '0.4 0.4 0.4');
          entity.setAttribute('rotation', '0 0 0');
          entity.setAttribute('position', '0 -1.2 -2.0');
        } 
        else if (selected === 'elephant') {
          entity.setAttribute('gltf-model', 'assets/elephant.glb');
          entity.setAttribute('scale', '0.4 0.4 0.4');
          entity.setAttribute('rotation', '0 0 0');
          entity.setAttribute('position', '0 -1.2 -2.5');
        }
      }

      document.getElementById('landing-screen').style.display = 'none';
      document.getElementById('ar-ui').style.display = 'flex';
      document.getElementById('watermark').style.display = 'block';
    });

    function goHome() {
      const entity = document.getElementById('active-animal');
      if (entity) {
        entity.removeAttribute('gltf-model');
        entity.removeAttribute('animation-mixer');
      }
      if (isRecording) toggleVideoRecord();

      document.getElementById('landing-screen').style.display = 'flex';
      document.getElementById('ar-ui').style.display = 'none';
      document.getElementById('watermark').style.display = 'none';
    }

    let facingMode = 'environment';
    async function toggleCamera() {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      const video = document.querySelector('video');
      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
        if (video) video.srcObject = stream;
      } catch (err) {
        console.error("Camera switch error:", err);
      }
    }

    // High-Resolution Native Sensor Snapshot with Web Share Integration
    async function takeSnapshot() {
      const videoEl = document.querySelector('video');
      const sceneEl = document.querySelector('a-scene');

      const canvas = document.createElement('canvas');
      canvas.width = videoEl ? (videoEl.videoWidth || window.innerWidth) : window.innerWidth;
      canvas.height = videoEl ? (videoEl.videoHeight || window.innerHeight) : window.innerHeight;
      const ctx = canvas.getContext('2d');

      if (videoEl) ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

      const arCanvas = sceneEl.components.screenshot.getCanvas('perspective');
      ctx.drawImage(arCanvas, 0, 0, canvas.width, canvas.height);

      ctx.font = 'bold 36px Arial';
      ctx.fillStyle = '#00ff88';
      ctx.fillText('TZP WILDLIFE AR', 40, 80);

      canvas.toBlob(async (blob) => {
        const file = new File([blob], `TZP-AR-Selfie-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'TZP Wildlife AR Selfie',
              text: 'Check out my wildlife encounter at Thrissur Zoological Park!'
            });
            return;
          } catch (err) {
            console.log('Share fallback:', err);
          }
        }

        const link = document.createElement('a');
        link.download = file.name;
        link.href = URL.createObjectURL(blob);
        link.click();
      }, 'image/png');
    }

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    function toggleVideoRecord() {
      const recBtn = document.getElementById('rec-btn');
      const sceneCanvas = document.querySelector('canvas.a-canvas');

      if (!isRecording) {
        recordedChunks = [];
        const stream = sceneCanvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `TZP-AR-Video-${Date.now()}.webm`;
          link.click();
        };

        mediaRecorder.start();
        recBtn.innerText = "Stop Recording ⏹️";
        recBtn.style.background = "#ff4444";
        recBtn.style.color = "#ffffff";
        isRecording = true;
      } else {
        mediaRecorder.stop();
        recBtn.innerText = "Record Video 🎥";
        recBtn.style.background = "#00ff88";
        recBtn.style.color = "#05200a";
        isRecording = false;
      }
    }
  </script>
</body>
</html>
