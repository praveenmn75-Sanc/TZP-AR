<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TZP Wildlife AR Zone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- A-Frame & AR.js Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }

    #landing-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #121212;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #00ff88;
    }

    select.btn-select {
      width: 80%;
      max-width: 300px;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #00ff88;
      background: #1e1e1e;
      color: #fff;
      outline: none;
      margin-bottom: 25px;
    }

    .btn-launch {
      background: #00ff88;
      color: #05200a;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }

    #watermark {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9998;
      color: #00ff88;
      font-weight: bold;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      pointer-events: none;
    }

    #ar-ui {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 400px;
    }

    .control-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .ar-btn {
      background: rgba(30, 30, 30, 0.85);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
    }

    .btn-action {
      background: #00ff88;
      color: #05200a;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Landing Screen -->
  <div id="landing-screen">
    <div class="title">TZP WILDLIFE AR ZONE</div>
    <select id="animal-select" class="btn-select">
      <option value="tiger">Bengal Tiger</option>
      <option value="elephant">Asian Elephant</option>
    </select>
    <button class="btn-launch" id="launch-btn">Launch AR Camera</button>
  </div>

  <!-- Watermark -->
  <div id="watermark">TZP WILDLIFE AR</div>

  <!-- AR UI Overlay -->
  <div id="ar-ui">
    <div class="control-row">
      <button class="ar-btn" onclick="toggleCamera()">Flip Cam 🔄</button>
    </div>
    <div class="control-row">
      <button class="ar-btn btn-action" onclick="takeSnapshot()">Take Photo 📸</button>
      <button class="ar-btn btn-action" id="rec-btn" onclick="toggleVideoRecord()">Record Video 🎥</button>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="tiger-model" src="assets/tiger.glb"></a-asset-item>
      <a-asset-item id="elephant-model" src="assets/elephant.glb"></a-asset-item>
    </a-assets>

    <!-- Scene Lighting -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="0 10 5" intensity="1"></a-light>

    <!-- Camera Anchored Viewport -->
    <a-entity id="main-camera" camera look-controls>
      <a-entity 
        id="active-animal" 
        position="0 -0.8 -2.5" 
        rotation="0 180 0" 
        scale="1 1 1">
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.getElementById('launch-btn').addEventListener('click', function() {
      const selected = document.getElementById('animal-select').value;
      const entity = document.getElementById('active-animal');
      
      if (entity) {
        // Bind selected GLB model and adjust scale dynamically
        if (selected === 'elephant') {
          entity.setAttribute('gltf-model', '#elephant-model');
          entity.setAttribute('scale', '0.5 0.5 0.5'); // Adjusted scale for larger models
        } else {
          entity.setAttribute('gltf-model', '#tiger-model');
          entity.setAttribute('scale', '1 1 1');
        }
      }

      document.getElementById('landing-screen').style.display = 'none';
      document.getElementById('ar-ui').style.display = 'flex';
      document.getElementById('watermark').style.display = 'block';
    });

    let facingMode = 'environment';
    async function toggleCamera() {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      const video = document.querySelector('video');
      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
        if (video) video.srcObject = stream;
      } catch (err) {
        console.error("Camera switch error:", err);
      }
    }

    function takeSnapshot() {
      const sceneEl = document.querySelector('a-scene');
      const videoEl = document.querySelector('video');
      
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      if (videoEl) {
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      }

      const arCanvas = sceneEl.components.screenshot.getCanvas('perspective');
      ctx.drawImage(arCanvas, 0, 0, canvas.width, canvas.height);

      ctx.font = 'bold 22px Arial';
      ctx.fillStyle = '#00ff88';
      ctx.fillText('TZP WILDLIFE AR', 30, 50);

      const link = document.createElement('a');
      link.download = `TZP-AR-Photo-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    function toggleVideoRecord() {
      const recBtn = document.getElementById('rec-btn');
      const sceneCanvas = document.querySelector('canvas.a-canvas');

      if (!isRecording) {
        recordedChunks = [];
        const stream = sceneCanvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `TZP-AR-Video-${Date.now()}.webm`;
          link.click();
        };

        mediaRecorder.start();
        recBtn.innerText = "Stop Recording ⏹️";
        recBtn.style.background = "#ff4444";
        recBtn.style.color = "#ffffff";
        isRecording = true;
      } else {
        mediaRecorder.stop();
        recBtn.innerText = "Record Video 🎥";
        recBtn.style.background = "#00ff88";
        recBtn.style.color = "#05200a";
        isRecording = false;
      }
    }
  </script>
</body>
</html>
