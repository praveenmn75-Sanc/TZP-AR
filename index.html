<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TZP Wildlife AR Zone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">

  <!-- Production A-Frame, AR.js, and Animation Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
      touch-action: none;
    }

    #landing-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #121212;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #00ff88;
      letter-spacing: 1px;
    }

    .select-label {
      font-size: 14px;
      margin-bottom: 10px;
      color: #ccc;
    }

    select.btn-select {
      width: 80%;
      max-width: 300px;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #00ff88;
      background: #1e1e1e;
      color: #fff;
      outline: none;
      margin-bottom: 25px;
    }

    .btn-launch {
      background: #00ff88;
      color: #05200a;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
    }

    #loading-indicator {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #00ff88;
      font-size: 16px;
      font-weight: bold;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 20px;
      border-radius: 10px;
      border: 1px solid #00ff88;
      text-align: center;
      max-width: 80%;
      word-wrap: break-word;
    }

    #watermark {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9998;
      color: #00ff88;
      font-weight: bold;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 136, 0.3);
      pointer-events: none;
    }

    #ar-ui {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 400px;
    }

    .control-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .ar-btn {
      background: rgba(30, 30, 30, 0.85);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
    }

    .btn-action {
      background: #00ff88;
      color: #05200a;
      border: none;
    }
  </style>

  <script>
    AFRAME.registerComponent('model-controls', {
      init: function () {
        this.pointers = {};
        this.baseScale = 0.4;
        this.initialDistance = 0;

        window.addEventListener('touchstart', (e) => {
          if (e.target.closest('#ar-ui') || e.target.closest('#landing-screen')) return;
          for (let i = 0; i < e.touches.length; i++) {
            this.pointers[e.touches[i].identifier] = { x: e.touches[i].clientX, y: e.touches[i].clientY };
          }
          if (Object.keys(this.pointers).length === 2) {
            const keys = Object.keys(this.pointers);
            const p1 = this.pointers[keys[0]];
            const p2 = this.pointers[keys[1]];
            this.initialDistance = Math.hypot(p1.x - p2.x, p1.y - p2.y);
            this.baseScale = this.el.getAttribute('scale').x || 0.4;
          }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
          if (e.target.closest('#ar-ui') || e.target.closest('#landing-screen')) return;

          // 1-Finger Rotation (Vertical + Horizontal)
          if (e.touches.length === 1) {
            const touch = e.touches[0];
            const oldTouch = this.pointers[touch.identifier];
            if (oldTouch) {
              const deltaX = touch.clientX - oldTouch.x;
              const deltaY = touch.clientY - oldTouch.y;
              
              let currentRot = this.el.getAttribute('rotation');
              if (!currentRot) currentRot = {x: 0, y: 0, z: 0};

              this.el.setAttribute('rotation', {
                x: currentRot.x + (deltaY * 0.6), 
                y: currentRot.y + (deltaX * 0.6), 
                z: currentRot.z
              });
            }
            this.pointers[touch.identifier] = { x: touch.clientX, y: touch.clientY };
          }
          // 2-Finger Scale
          else if (e.touches.length === 2) {
            const keys = Object.keys(this.pointers);
            const t1 = Array.from(e.touches).find(t => t.identifier == keys[0]);
            const t2 = Array.from(e.touches).find(t => t.identifier == keys[1]);

            if (t1 && t2) {
              const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
              const scaleRatio = currentDist / this.initialDistance;
              let newScale = this.baseScale * scaleRatio;
              newScale = Math.max(0.05, Math.min(newScale, 5.0)); 
              
              this.el.setAttribute('scale', {x: newScale, y: newScale, z: newScale});

              this.pointers[t1.identifier] = { x: t1.clientX, y: t1.clientY };
              this.pointers[t2.identifier] = { x: t2.clientX, y: t2.clientY };
            }
          }
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
          for (let i = 0; i < e.changedTouches.length; i++) {
            delete this.pointers[e.changedTouches[i].identifier];
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Landing Screen Overlay -->
  <div id="landing-screen">
    <div class="title">TZP WILDLIFE AR ZONE</div>
    <div class="select-label">Select an Animal Experience:</div>
    <select id="animal-select" class="btn-select">
      <!-- Removed Animated Elephant -->
      <option value="tiger_anim">Bengal Tiger (Walking 🐾)</option>
      <option value="tiger">Bengal Tiger (Static 🐅)</option>
      <option value="elephant">Asian Elephant (Static 🐘)</option>
    </select>
    <button class="btn-launch" id="launch-btn">Launch AR Camera</button>
  </div>

  <div id="loading-indicator">Loading 3D Model... ⏳</div>
  <div id="watermark">TZP WILDLIFE AR</div>

  <div id="ar-ui">
    <div class="control-row">
      <button class="ar-btn" onclick="goHome()" style="background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.4);">Home 🏠</button>
      <button class="ar-btn" onclick="toggleCamera()">Flip Cam 🔄</button>
      <button class="ar-btn" onclick="playSound()">Roar 🔊</button>
    </div>
    <div class="control-row">
      <button class="ar-btn btn-action" onclick="takeSnapshot()">Take Photo 📸</button>
      <button class="ar-btn btn-action" id="rec-btn" onclick="toggleVideoRecord()" style="background: #00ff88; color: #05200a; border: none;">Record Video 🎥</button>
    </div>
  </div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false"
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/; meshoptDecoderPath: https://unpkg.com/meshoptimizer@0.18.1/meshopt_decoder.js;">

    <a-light type="ambient" intensity="2.5"></a-light>
    <a-light type="directional" position="1 4 2" intensity="2.0"></a-light>

    <a-entity camera look-controls></a-entity>

    <a-entity 
      id="animal-container" 
      model-controls 
      position="0 -1.2 -2.2"
      scale="0.4 0.4 0.4"
      rotation="0 0 0">
    </a-entity>
  </a-scene>

  <script>
    const SOUNDS = {
      tiger: new Audio('https://cdn.freesound.org/previews/512/512132_10825368-lq.mp3'),
      elephant: new Audio('https://cdn.freesound.org/previews/464/464871_9511679-lq.mp3')
    };

    function playSound() {
      const selected = document.getElementById('animal-select').value;
      const key = selected.includes('elephant') ? 'elephant' : 'tiger';
      if (SOUNDS[key]) {
        SOUNDS[key].currentTime = 0;
        SOUNDS[key].play().catch(e => console.log('Audio permission required:', e));
      }
    }

    document.getElementById('launch-btn').addEventListener('click', function() {
      const selected = document.getElementById('animal-select').value;
      const container = document.getElementById('animal-container');

      if (container) {
        document.getElementById('loading-indicator').innerText = 'Loading 3D Model... ⏳';
        document.getElementById('loading-indicator').style.display = 'block';
        
        container.innerHTML = ''; 
        container.setAttribute('scale', {x: 0.4, y: 0.4, z: 0.4});
        container.setAttribute('rotation', {x: 0, y: 0, z: 0});

        const newAnimal = document.createElement('a-entity');
        newAnimal.setAttribute('gltf-model', `assets/${selected}.glb`);
        
        if (selected.includes('anim')) {
          newAnimal.setAttribute('animation-mixer', 'clip: *; loop: repeat;');
        }

        newAnimal.addEventListener('model-loaded', () => {
          document.getElementById('loading-indicator').style.display = 'none';
        });

        // Catch and display exact error if the model fails
        newAnimal.addEventListener('model-error', (err) => {
          console.error("A-Frame Model Error: ", err);
          document.getElementById('loading-indicator').innerText = 'Model Format Error ❌ Check Console';
        });

        container.appendChild(newAnimal);
      }

      document.getElementById('landing-screen').style.display = 'none';
      document.getElementById('ar-ui').style.display = 'flex';
      document.getElementById('watermark').style.display = 'block';
    });

    function goHome() {
      const container = document.getElementById('animal-container');
      if (container) container.innerHTML = ''; 
      if (isRecording) toggleVideoRecord();

      document.getElementById('landing-screen').style.display = 'flex';
      document.getElementById('ar-ui').style.display = 'none';
      document.getElementById('watermark').style.display = 'none';
      document.getElementById('loading-indicator').style.display = 'none';
    }

    let facingMode = 'environment';
    async function toggleCamera() {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      const video = document.querySelector('video');
      if (video && video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
        if (video) video.srcObject = stream;
      } catch (err) {
        console.error("Camera switch error:", err);
      }
    }

    async function takeSnapshot() {
      const videoEl = document.querySelector('video');
      const sceneEl = document.querySelector('a-scene');

      const canvas = document.createElement('canvas');
      canvas.width = videoEl ? (videoEl.videoWidth || window.innerWidth) : window.innerWidth;
      canvas.height = videoEl ? (videoEl.videoHeight || window.innerHeight) : window.innerHeight;
      const ctx = canvas.getContext('2d');

      if (videoEl) ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

      const arCanvas = sceneEl.components.screenshot.getCanvas('perspective');
      ctx.drawImage(arCanvas, 0, 0, canvas.width, canvas.height);

      ctx.font = 'bold 36px Arial';
      ctx.fillStyle = '#00ff88';
      ctx.fillText('TZP WILDLIFE AR', 40, 80);

      canvas.toBlob(async (blob) => {
        const file = new File([blob], `TZP-AR-Selfie-${Date.now()}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'TZP Wildlife AR Selfie',
              text: 'Check out my wildlife encounter at Thrissur Zoological Park!'
            });
            return;
          } catch (err) {
            console.log('Share fallback:', err);
          }
        }
        const link = document.createElement('a');
        link.download = file.name;
        link.href = URL.createObjectURL(blob);
        link.click();
      }, 'image/png');
    }

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    function toggleVideoRecord() {
      const recBtn = document.getElementById('rec-btn');
      const sceneCanvas = document.querySelector('canvas.a-canvas');

      if (!isRecording) {
        recordedChunks = [];
        const stream = sceneCanvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `TZP-AR-Video-${Date.now()}.webm`;
          link.click();
        };

        mediaRecorder.start();
        recBtn.innerText = "Stop Recording ⏹";
        recBtn.style.background = "#ff4444";
        recBtn.style.color = "#ffffff";
        isRecording = true;
      } else {
        mediaRecorder.stop();
        recBtn.innerText = "Record Video 🎥";
        recBtn.style.background = "#00ff88";
        recBtn.style.color = "#05200a";
        isRecording = false;
      }
    }
  </script>
</body>
</html>
